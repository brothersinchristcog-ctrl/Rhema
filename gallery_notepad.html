<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notepad — Church Gallery & Media Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f19;
      --sidebar-bg: #111827;
      --card-bg: #1a2234;
      --card-hover: #222d44;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --gold: #f59e0b;
      --emerald: #10b981;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --border: #232e47;
      --toolbar-bg: #141d30;
      --editor-bg: #0e1422;
      --success: #10b981;
      --danger: #ef4444;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 300px; min-width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    .sidebar-header { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
    .app-title { font-size: 19px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 14px; letter-spacing: -0.4px; }
    .new-note-btn { width: 100%; padding: 10px 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; color: #0b1329; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s, transform 0.1s; }
    .new-note-btn:hover { opacity: 0.92; }
    .new-note-btn:active { transform: scale(0.98); }
    .search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .search-wrap input { width: 100%; padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .notes-list { flex: 1; overflow-y: auto; padding: 8px; }
    .notes-list::-webkit-scrollbar { width: 4px; }
    .notes-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .note-item { padding: 12px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; position: relative; }
    .note-item:hover { background: var(--card-hover); }
    .note-item.active { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.35); }
    .note-item-title { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .note-item-preview { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-item-date { font-size: 10.5px; color: var(--text-muted); margin-top: 5px; opacity: 0.7; }
    .note-delete-btn { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; background: rgba(239,68,68,0.15); border: none; border-radius: 6px; color: var(--danger); font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; transition: background 0.15s; }
    .note-item:hover .note-delete-btn { display: flex; }
    .note-delete-btn:hover { background: rgba(239,68,68,0.3); }
    .notes-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 20px; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .toolbar { display: flex; align-items: center; gap: 4px; padding: 10px 20px; background: var(--toolbar-bg); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .toolbar-group { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--border); }
    .toolbar-group:last-child { border-right: none; margin-left: auto; }
    .tool-btn { width: 32px; height: 32px; background: transparent; border: none; border-radius: 7px; color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
    .tool-btn:hover { background: var(--card-bg); color: var(--text); }
    .font-size-select { background: var(--card-bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; padding: 4px 6px; cursor: pointer; outline: none; }
    .action-btn { padding: 6px 14px; border-radius: 7px; border: none; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .action-btn:hover { opacity: 0.85; }
    .btn-export { background: rgba(56,189,248,0.18); color: var(--accent); }
    .btn-clear { background: rgba(239,68,68,0.12); color: var(--danger); }

    .note-title-input { width: 100%; padding: 18px 24px 10px; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; outline: none; letter-spacing: -0.4px; }
    .note-title-input::placeholder { color: var(--text-muted); }

    .editor-wrap { flex: 1; overflow-y: auto; background: var(--editor-bg); }
    .editor-wrap::-webkit-scrollbar { width: 5px; }
    .editor-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    #editor { min-height: calc(100vh - 200px); padding: 22px 32px 50px; outline: none; font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.8; color: var(--text); caret-color: var(--accent); }
    #editor:empty::before { content: attr(data-placeholder); color: var(--text-muted); pointer-events: none; }
    #editor b, #editor strong { color: #fff; font-weight: 700; }
    #editor i, #editor em { color: #c7d2fe; }
    #editor u { text-decoration-color: var(--accent); }
    #editor h1 { font-size: 26px; font-weight: 700; margin: 24px 0 12px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    #editor h2 { font-size: 19px; font-weight: 600; margin: 18px 0 8px; color: #bae6fd; }
    #editor h3 { font-size: 16px; font-weight: 600; margin: 14px 0 4px; color: var(--text-dim); }
    #editor ul, #editor ol { padding-left: 24px; margin: 10px 0; }
    #editor li { margin-bottom: 6px; }
    #editor blockquote { border-left: 3px solid var(--accent); padding: 10px 18px; margin: 16px 0; color: #e0f2fe; background: rgba(56, 189, 248, 0.08); border-radius: 0 8px 8px 0; font-style: italic; }
    #editor hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
    #editor table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13.5px; }
    #editor th { background: rgba(56,189,248,0.15); color: var(--accent); padding: 10px 12px; text-align: left; border: 1px solid var(--border); font-weight: 600; }
    #editor td { padding: 9px 12px; border: 1px solid var(--border); color: var(--text-dim); }
    #editor code { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: rgba(56,189,248,0.12); padding: 2px 6px; border-radius: 4px; color: #7dd3fc; }

    .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 24px; background: var(--toolbar-bg); border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); }
    .status-indicator { display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .no-note { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-muted); }
    .no-note-icon { font-size: 48px; opacity: 0.3; }
    .no-note-create-btn { margin-top: 8px; padding: 10px 22px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; color: #0b1329; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="app-title">📸 Gallery Notepad</div>
    <button class="new-note-btn" onclick="createNote()">＋ New Note</button>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 Search gallery notes..." oninput="renderNotesList()" />
  </div>
  <div class="notes-list" id="notesList"></div>
</div>

<div class="main">
  <div class="no-note" id="noNoteView" style="display:none;">
    <div class="no-note-icon">🖼️</div>
    <h3>No note selected</h3>
    <p>Select a note from the sidebar or create a new one.</p>
    <button class="no-note-create-btn" onclick="createNote()">＋ Create New Note</button>
  </div>

  <div id="editorView" style="display:flex; flex-direction:column; height:100vh; overflow:hidden; flex:1;">
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="tool-btn" title="Bold" onclick="format('bold')"><b>B</b></button>
        <button class="tool-btn" title="Italic" onclick="format('italic')"><i>I</i></button>
        <button class="tool-btn" title="Underline" onclick="format('underline')"><u>U</u></button>
        <button class="tool-btn" title="Strikethrough" onclick="format('strikeThrough')"><s>S</s></button>
      </div>
      <div class="toolbar-group">
        <select class="font-size-select" onchange="changeFontSize(this.value)">
          <option value="3">Normal</option>
          <option value="1">Small</option>
          <option value="5">Large</option>
          <option value="6">Huge</option>
        </select>
      </div>
      <div class="toolbar-group">
        <button class="tool-btn" title="H1" onclick="format('formatBlock','<h1>')">H1</button>
        <button class="tool-btn" title="H2" onclick="format('formatBlock','<h2>')">H2</button>
        <button class="tool-btn" title="H3" onclick="format('formatBlock','<h3>')">H3</button>
      </div>
      <div class="toolbar-group">
        <button class="tool-btn" title="Bullet List" onclick="format('insertUnorderedList')">•—</button>
        <button class="tool-btn" title="Numbered List" onclick="format('insertOrderedList')">1.</button>
        <button class="tool-btn" title="Blockquote" onclick="format('formatBlock','<blockquote>')">"</button>
      </div>
      <div class="toolbar-group">
        <button class="tool-btn" title="Undo" onclick="format('undo')">↩</button>
        <button class="tool-btn" title="Redo" onclick="format('redo')">↪</button>
      </div>
      <div class="toolbar-group">
        <button class="action-btn btn-export" onclick="exportNote()">⬇ Export .txt</button>
        <button class="action-btn btn-clear" onclick="clearNote()">🗑 Clear</button>
      </div>
    </div>

    <input type="text" id="noteTitle" class="note-title-input" placeholder="Untitled Note" oninput="handleTitleChange()" />

    <div class="editor-wrap">
      <div id="editor" contenteditable="true" data-placeholder="Start typing..." oninput="handleEditorChange()" onkeydown="handleKeydown(event)" spellcheck="true"></div>
    </div>

    <div class="status-bar">
      <div class="status-indicator">
        <div class="dot" id="saveDot"></div>
        <span id="saveStatus">All changes saved</span>
      </div>
      <div style="display:flex;gap:20px;">
        <span id="wordCount">0 words</span>
        <span id="charCount">0 chars</span>
        <span id="noteDate" style="color:#475569;"></span>
      </div>
    </div>
  </div>
</div>

  const NOTE_2_HTML = `
<h1>🏛️ Admin Church Gallery — Full Feature Manual</h1>
<p><i>Comprehensive technical and operational manual for church administrators and media teams in WeChristian.</i></p>
<hr>

<h2>1. Overview & Cloud Architecture</h2>
<p>The Church Gallery module is architected for high-performance media storage, rapid CDN distribution, and strict church-tenant isolation:</p>
<ul>
  <li><b>Church-Scoped Isolation:</b> All albums reside in <code>churches/{churchId}/gallery_albums/{albumId}</code>. Different churches on the platform cannot access or query other churches' media assets.</li>
  <li><b>Sub-Collection Storage:</b> Album photos are stored as sub-documents in <code>churches/{churchId}/gallery_albums/{albumId}/photos/{photoId}</code>, enabling scalable pagination without loading all photos into memory at once.</li>
  <li><b>Firebase Cloud Storage Hierarchy:</b>
    <ul>
      <li><i>Album Covers:</i> Stored in <code>churches/{churchId}/gallery_covers/cover_{timestamp}.jpg</code>.</li>
      <li><i>Album Photos:</i> Stored in <code>churches/{churchId}/gallery/{albumId}/photo_{timestamp}_{random}.jpg</code>.</li>
    </ul>
  </li>
  <li><b>Atomic Counters:</b> The album document tracks <code>photoCount</code> using Firestore's atomic <code>FieldValue.increment(1)</code> and <code>FieldValue.increment(-1)</code>, ensuring accurate counts even during concurrent uploads.</li>
</ul>

<h2>2. Admin Dashboard & KPI Metrics</h2>
<p>The dashboard renders real-time summary statistics calculated from active church records:</p>
<table>
  <tr><th>Metric</th><th>Source</th><th>Description</th></tr>
  <tr><td><b>ALBUMS</b></td><td><code>albums.length</code></td><td>Total number of photo albums created in the church directory.</td></tr>
  <tr><td><b>PHOTOS</b></td><td><code>totalPhotos</code></td><td>Calculated sum of all <code>photoCount</code> attributes across all albums.</td></tr>
  <tr><td><b>LATEST</b></td><td>Timestamp analysis</td><td>Shows recent activity status to keep the media feed fresh.</td></tr>
</table>

<h2>3. Creating an Album (<code>AdminGalleryCreateAlbum.tsx</code>)</h2>
<ol>
  <li><b>Album Name:</b> Required text field specifying the event or ministry occasion.</li>
  <li><b>Description:</b> Optional multiline text field providing pastoral notes, theme scriptures, or event summary.</li>
  <li><b>16:9 Cover Photo Picker:</b>
    <ul>
      <li>Uses <code>expo-image-picker</code> with <code>allowsEditing: true</code> and <code>aspect: [16, 9]</code>.</li>
      <li>Uploads directly to Cloud Storage and stores the public download URL in the album document.</li>
    </ul>
  </li>
  <li><b>Event Notification:</b> Emits <code>GALLERY_ALBUM_CREATED</code> via <code>DeviceEventEmitter</code> to trigger celebratory UI toasts on the parent dashboard.</li>
</ol>

<h2>4. Batch Photo Uploading Engine</h2>
<p>In <code>AdminGalleryAlbumDetail.tsx</code>, media admins can upload photos efficiently:</p>
<ul>
  <li><b>Multi-Image Selection:</b> Uses <code>launchImageLibraryAsync</code> with <code>allowsMultipleSelection: true</code> and a safety threshold of <code>selectionLimit: 20</code> to prevent device memory exhaustion.</li>
  <li><b>Intelligent Client-Side Compression:</b> Compresses images to <code>quality: 0.5</code> during picker export, accelerating upload speeds by over 300% on cellular networks while preserving display sharpness.</li>
  <li><b>Sequential Cloud Upload Loop:</b> Each photo is streamed to Cloud Storage, registered in the <code>photos</code> sub-collection, and the album's aggregate count is incremented atomically.</li>
</ul>

<h2>5. Full-Screen Lightbox Viewer & Gestures</h2>
<ul>
  <li><b>FlatList Horizontal Paging:</b> Full-screen carousel with <code>pagingEnabled: true</code> for seamless 60fps swiping.</li>
  <li><b>Tap-to-Toggle Controls:</b> Tapping the picture toggles header and footer toolbars for complete full-screen visibility.</li>
  <li><b>Device Gallery Download:</b> Uses <code>expo-file-system</code> to download the remote URL to a local cache directory, then commits it to the user's camera roll via <code>MediaLibrary.saveToLibraryAsync</code>.</li>
  <li><b>Native Share Sheet:</b> Leverages <code>expo-sharing</code> to trigger iOS AirDrop / Android Intent share sheets with zero external dependencies.</li>
</ul>

<h2>6. Cascading Deletion Safety Engine</h2>
<p>When an admin deletes a photo or an entire album:</p>
<ul>
  <li><b>Single Photo Deletion:</b> Removes Firestore doc, decrements <code>photoCount</code> by 1, and deletes the binary object from Cloud Storage via <code>storage().refFromURL(photoUrl).delete()</code>.</li>
  <li><b>Full Album Deletion:</b> Executes a cascading purge:
    <ol>
      <li>Queries all photos in the sub-collection.</li>
      <li>Deletes each corresponding file from Cloud Storage.</li>
      <li>Deletes each photo sub-document in Firestore.</li>
      <li>Deletes the 16:9 cover photo from Cloud Storage.</li>
      <li>Deletes the primary album document from Firestore.</li>
    </ol>
  </li>
  <li><b>Modal Guardrails:</b> A custom dark-mode confirmation modal requires explicit confirmation before any deletion proceeds.</li>
</ul>
`;

  // ── Note 4: End-to-End Workflow ──
  const NOTE_4_HTML = `

  // ── Storage and State ──
  const STORAGE_KEY = 'wechristian_gallery_notes';
  let notes = [];
  let currentNoteId = null;
  let saveTimeout = null;

  function initApp() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        notes = JSON.parse(saved);
      } catch (e) {
        notes = [];
      }
    }

    if (!notes || notes.length === 0) {
      const now = new Date().toISOString();
      notes = [
        {
          id: 'note-1',
          title: '🎥 Video Recording Script: Admin & Member Church Gallery',
          content: NOTE_1_HTML,
          createdAt: now,
          updatedAt: now
        },
        {
          id: 'note-2',
          title: '🏛️ Admin Church Gallery — Full Feature Manual',
          content: NOTE_2_HTML,
          createdAt: now,
          updatedAt: now
        },
        {
          id: 'note-3',
          title: '📱 Member Church Gallery — Full Manual',
          content: NOTE_3_HTML,
          createdAt: now,
          updatedAt: now
        },
        {
          id: 'note-4',
          title: '🔄 End-to-End Workflow: Capture to Congregation',
          content: NOTE_4_HTML,
          createdAt: now,
          updatedAt: now
        }
      ];
      saveNotesToStorage();
    }

    renderNotesList();
    if (notes.length > 0) {
      selectNote(notes[0].id);
    } else {
      showNoNoteView();
    }
  }

  function saveNotesToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function renderNotesList() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
    const listEl = document.getElementById('notesList');
    listEl.innerHTML = '';

    const filtered = notes.filter(n => {
      const matchTitle = (n.title || '').toLowerCase().includes(searchVal);
      const matchContent = (n.content || '').toLowerCase().includes(searchVal);
      return matchTitle || matchContent;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="notes-empty">No matching gallery notes found</div>';
      return;
    }

    filtered.forEach(note => {
      const div = document.createElement('div');
      div.className = 'note-item' + (note.id === currentNoteId ? ' active' : '');
      div.onclick = (e) => {
        if (!e.target.classList.contains('note-delete-btn')) {
          selectNote(note.id);
        }
      };

      const plainText = (note.content || '').replace(/<[^>]*>/g, '').trim().substring(0, 70);
      const d = new Date(note.updatedAt || note.createdAt);
      const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="note-item-title">${escapeHtml(note.title || 'Untitled Note')}</div>
        <div class="note-item-preview">${escapeHtml(plainText || 'No additional content')}</div>
        <div class="note-item-date">${dateStr}</div>
        <button class="note-delete-btn" title="Delete note" onclick="deleteNote(event, '${note.id}')">✕</button>
      `;
      listEl.appendChild(div);
    });
  }

  function selectNote(id) {
    currentNoteId = id;
    const note = notes.find(n => n.id === id);
    if (!note) {
      showNoNoteView();
      return;
    }

    document.getElementById('noNoteView').style.display = 'none';
    document.getElementById('editorView').style.display = 'flex';

    document.getElementById('noteTitle').value = note.title || '';
    document.getElementById('editor').innerHTML = note.content || '';

    const d = new Date(note.updatedAt || note.createdAt);
    document.getElementById('noteDate').textContent = 'Saved ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    updateWordCount();
    renderNotesList();
  }

  function showNoNoteView() {
    currentNoteId = null;
    document.getElementById('noNoteView').style.display = 'flex';
    document.getElementById('editorView').style.display = 'none';
  }

  function createNote() {
    const id = 'note-' + Date.now();
    const now = new Date().toISOString();
    const newNote = {
      id,
      title: 'New Gallery Note',
      content: '<p>Start drafting album descriptions, photo captions, or media guidelines here...</p>',
      createdAt: now,
      updatedAt: now
    };
    notes.unshift(newNote);
    saveNotesToStorage();
    selectNote(id);
  }

  function deleteNote(e, id) {
    e.stopPropagation();
    if (!confirm('Are you sure you want to delete this note?')) return;
    notes = notes.filter(n => n.id !== id);
    saveNotesToStorage();
    if (currentNoteId === id) {
      if (notes.length > 0) {
        selectNote(notes[0].id);
      } else {
        showNoNoteView();
      }
    } else {
      renderNotesList();
    }
  }

  function handleTitleChange() {
    if (!currentNoteId) return;
    const titleVal = document.getElementById('noteTitle').value;
    const note = notes.find(n => n.id === currentNoteId);
    if (note) {
      note.title = titleVal;
      note.updatedAt = new Date().toISOString();
      triggerAutosave();
    }
  }

  function handleEditorChange() {
    if (!currentNoteId) return;
    const contentVal = document.getElementById('editor').innerHTML;
    const note = notes.find(n => n.id === currentNoteId);
    if (note) {
      note.content = contentVal;
      note.updatedAt = new Date().toISOString();
      triggerAutosave();
      updateWordCount();
    }
  }

  function triggerAutosave() {
    const dot = document.getElementById('saveDot');
    const status = document.getElementById('saveStatus');
    status.textContent = 'Saving...';
    dot.style.background = '#f59e0b';

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      saveNotesToStorage();
      renderNotesList();
      status.textContent = 'All changes saved';
      dot.style.background = '#10b981';
      const d = new Date();
      document.getElementById('noteDate').textContent = 'Saved ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 500);
  }

  function updateWordCount() {
    const text = document.getElementById('editor').innerText || '';
    const words = text.trim() ? text.trim().split(/\\s+/).length : 0;
    const chars = text.length;
    document.getElementById('wordCount').textContent = words + ' words';
    document.getElementById('charCount').textContent = chars + ' chars';
  }

  function format(cmd, val = null) {
    document.execCommand(cmd, false, val);
    document.getElementById('editor').focus();
    handleEditorChange();
  }

  function changeFontSize(size) {
    document.execCommand('fontSize', false, size);
    document.getElementById('editor').focus();
    handleEditorChange();
  }

  function handleKeydown(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      document.execCommand('insertText', false, '    ');
    }
  }

  function exportNote() {
    if (!currentNoteId) return;
    const note = notes.find(n => n.id === currentNoteId);
    if (!note) return;

    const title = (note.title || 'gallery_note').replace(/[^a-zA-Z0-9_-]/g, '_');
    const content = (note.title ? '# ' + note.title + '\\n\\n' : '') + htmlToPlainText(note.content);

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = title + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  function clearNote() {
    if (!confirm('Clear all contents of this note?')) return;
    document.getElementById('editor').innerHTML = '';
    handleEditorChange();
  }

  function htmlToPlainText(html) {
    const temp = document.createElement('div');
    temp.innerHTML = html;
    return temp.innerText || temp.textContent || '';
  }

  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  window.addEventListener('DOMContentLoaded', initApp);
</script>
